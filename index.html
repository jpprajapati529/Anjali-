<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb3c6 100%);
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.2);
            text-align: center;
            max-width: 600px;
            margin: 20px;
            z-index: 10;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .heart {
            color: #ff4d6d;
            font-size: 50px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.25); }
            40% { transform: scale(1); }
            60% { transform: scale(1.15); }
            80% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* Floating background hearts */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .float-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            animation: floatUp 10s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }
        
        .gallery {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .gallery img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.1) rotate(5deg);
        }
    </style>
</head>
<body>

    <div class="floating-hearts" id="floating-hearts"></div>

    <div class="container">
        <div class="heart">❤️</div>
        <h1>To My Favorite Person</h1>
        <p>
            I built this little corner of the internet just for us. 
            Every day with you is my favorite day. Thank you for being you!
        </p>
        
        <div class="gallery">
            <img src="https://via.placeholder.com/150/ffb3c6/ffffff?text=Photo+1" alt="Us">
            <img src="https://via.placeholder.com/150/ffb3c6/ffffff?text=Photo+2" alt="Us">
            <img src="https://via.placeholder.com/150/ffb3c6/ffffff?text=Photo+3" alt="Us">
        </div>
    </div>

    <script>
        // Generate floating hearts
        const container = document.getElementById('floating-hearts');
        const heartSymbols = ['❤️', '💖', '✨', '💕'];
        
        for (let i = 0; i < 25; i++) {
            let heart = document.createElement('div');
            heart.classList.add('float-heart');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            container.appendChild(heart);
        }
    </script>
</body>
</html>
