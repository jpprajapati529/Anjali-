<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>For You 🌷</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
            font-family: system-ui, '-apple-system', 'BlinkMacSystemFont', 'Georgia', serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #ffccd5 0%, #dc143c 100%);
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            min-height: 100dvh; 
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.6);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            padding: 40px 20px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
            z-index: 10;
        }

        h1 {
            color: #dc143c;
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .center-icon {
            font-size: 60px;
            -webkit-animation: gentle-bounce 2.5s infinite ease-in-out;
            animation: gentle-bounce 2.5s infinite ease-in-out;
        }

        @-webkit-keyframes gentle-bounce {
            0%, 100% { -webkit-transform: translateY(0); }
            50% { -webkit-transform: translateY(-12px); }
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .floating-tulips {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .float-item {
            position: absolute;
            opacity: 0.7;
            -webkit-animation: floatUp 10s linear infinite;
            animation: floatUp 10s linear infinite;
        }

        @-webkit-keyframes floatUp {
            0% { -webkit-transform: translateY(100dvh) scale(0.5); opacity: 0.9; }
            100% { -webkit-transform: translateY(-20dvh) scale(1.5); opacity: 0; }
        }

        @keyframes floatUp {
            0% { transform: translateY(100dvh) scale(0.5); opacity: 0.9; }
            100% { transform: translateY(-20dvh) scale(1.5); opacity: 0; }
        }
        
        /* Interactive Boxes Styling */
        .interactive-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .i-card {
            width: 135px;
            height: 135px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #dc143c;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(220, 20, 60, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-transition: -webkit-transform 0.15s ease;
            transition: transform 0.15s ease;
        }

        .i-card:active {
            -webkit-transform: scale(0.92);
            transform: scale(0.92);
        }

        .hint-text {
            font-size: 0.75em;
            color: #888;
            margin-top: 8px;
            font-style: italic;
        }

        /* Box 1 */
        #r-text {
            color: #dc143c;
            font-weight: bold;
            font-size: 1.1em;
        }

        /* Box 2 (Orbit) */
        .orbit-system {
            position: relative;
            width: 50px;
            height: 50px;
            margin-bottom: 5px;
        }
        .star {
            position: absolute;
            top: 50%; left: 50%;
            width: 18px; height: 18px;
            background: #ffb3c6;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ffb3c6;
        }
        .planet-orbit {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 1px dashed #dc143c;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }
        .planet {
            position: absolute;
            top: -4px; left: 50%;
            width: 8px; height: 8px;
            background: #dc143c;
            border-radius: 50%;
            transform: translateX(-50%);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .orbit-message {
            font-size: 0.95em; 
            color: #dc143c; 
            font-weight: bold;
            display: none;
        }
        .i-card.revealed .orbit-system { display: none; }
        .i-card.revealed .orbit-message { display: block; }
        .i-card.revealed .hint-text { display: none; }

        /* Box 3 (Meter) */
        #m-text {
            color: #dc143c;
            font-weight: bold;
            font-size: 0.95em;
        }
        .meter-container {
            width: 90%; 
            height: 12px;
            background: #ffe6e6;
            border-radius: 10px;
            border: 1px solid #dc143c;
            overflow: hidden;
            margin-top: 10px;
        }
        .meter-fill {
            height: 100%; 
            width: 0%;
            background: #dc143c;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="floating-tulips" id="floating-tulips"></div>

    <div class="container">
        <div class="center-icon">🌷</div>
        <h1>To My Favorite Person</h1>
        <p>
            You're the only one I'd <em>tulip</em> over for! I built this little corner of the internet just for us.
        </p>
        
        <div class="interactive-row">
            
            <div class="i-card" onclick="nextReason()">
                <div id="r-text">Tap me! 💌</div>
                <div class="hint-text">(Find out why)</div>
            </div>

            <div class="i-card" onclick="this.classList.toggle('revealed')">
                <div class="orbit-system">
                    <div class="star"></div>
                    <div class="planet-orbit"><div class="planet"></div></div>
                </div>
                <div class="orbit-message">My world revolves around you! 🪐</div>
                <div class="hint-text">(Tap the universe)</div>
            </div>

            <div class="i-card" onclick="fillMeter()">
                <div id="m-text">Love Meter</div>
                <div class="meter-container">
                    <div class="meter-fill" id="m-fill"></div>
                </div>
                <div class="hint-text">(Tap to fill)</div>
            </div>

        </div>
    </div>

    <script>
        // Background Tulips
        const container = document.getElementById('floating-tulips');
        const floatSymbols = ['🌷', '🌷', '✨', '❤️']; 
        for (let i = 0; i < 25; i++) {
            let item = document.createElement('div');
            item.classList.add('float-item');
            item.innerText = floatSymbols[Math.floor(Math.random() * floatSymbols.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 5 + 7) + 's';
            item.style.animationDelay = (Math.random() * 5) + 's';
            item.style.fontSize = (Math.random() * 20 + 15) + 'px';
            container.appendChild(item);
        }

        // Logic for Box 1 (Reason Generator)
        const reasons = [
            "Your beautiful smile 🌷", 
            "You're my safe place ✨", 
            "Your amazing laugh ❤️", 
            "Everything about you 💖",
            "Tap me! 💌" // Resets back to default
        ];
        let rIdx = 0;
        function nextReason() {
            rIdx = (rIdx + 1) % reasons.length;
            document.getElementById('r-text').innerText = reasons[rIdx];
        }

        // Logic for Box 3 (Love Meter)
        let meter = 0;
        function fillMeter() {
            meter += 34; // Fills in 3 taps
            if(meter > 100) meter = 0; // Reset after it fills
            
            document.getElementById('m-fill').style.width = meter + '%';
            const text = document.getElementById('m-text');
            
            if(meter === 0) text.innerText = "Love Meter";
            else if(meter > 99) text.innerText = "Overflowing! ❤️";
            else text.innerText = "Keep tapping!";
        }
    </script>
</body>
</html>
