<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>For You 🌷</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, '-apple-system', 'BlinkMacSystemFont', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f8cdda; /* Matches the soft pink from the image */
            background: linear-gradient(135deg, #f8cdda 0%, #ffccd5 100%);
            color: #4a4a4a;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* --- THE PROMISE MODAL --- */
        #gateway {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .promise-card {
            background: #fffafa;
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(220, 20, 60, 0.15);
        }

        .promise-card h1 {
            color: #ff512f;
            font-size: 2.2em;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .promise-card p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .promise-btn {
            background: linear-gradient(to right, #ff512f, #dd2476);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 16px 0;
            width: 100%;
            font-size: 1.25em;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(221, 36, 118, 0.35);
            transition: transform 0.2s;
        }

        .promise-btn:active {
            transform: scale(0.95);
        }

        /* --- THE DASHBOARD --- */
        #dashboard {
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
            display: none;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            transition: opacity 1s ease;
            max-width: 600px;
            margin: 0 auto;
        }

        .dash-header {
            text-align: center;
            margin-bottom: 10px;
            color: #dc143c;
        }

        .widget {
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 20px rgba(220, 20, 60, 0.1);
        }

        /* Terminal Widget */
        .terminal {
            background: #1e1e1e;
            color: #ffb3c6;
            font-family: 'Courier New', Courier, monospace;
            border: none;
            min-height: 140px;
        }
        .term-header {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        #term-text {
            font-size: 0.9em;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .cursor {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Stats Widget */
        .stats-title {
            color: #dc143c;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 1.2em;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95em;
            border-bottom: 1px dashed rgba(220, 20, 60, 0.2);
            padding-bottom: 4px;
        }
        .stat-val { color: #dc143c; font-weight: bold; }

        /* Action Widget */
        .action-widget {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .action-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            color: #dc143c;
            border: 2px solid #dc143c;
            padding: 15px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 1.05em;
            transition: transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.92);
            background: #dc143c;
            color: white;
        }

        /* Floating Animation Elements */
        .float-item {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 4s ease-in forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Startup Promise Modal -->
    <div id="gateway">
        <div class="promise-card">
            <h1>Promise me... 🤞</h1>
            <p>That you will smile when you see it.</p>
            <button class="promise-btn" onclick="enterDashboard()">I promise! 💖</button>
        </div>
    </div>

    <!-- Main Interactive Dashboard -->
    <div id="dashboard">
        <div class="dash-header">
            <h2>LoveBoard OS 🌷</h2>
        </div>

        <!-- System Status Widget -->
        <div class="widget">
            <div class="stats-title">System Status 📊</div>
            <div class="stat-row">
                <span>Uptime</span>
                <span class="stat-val">Forever</span>
            </div>
            <div class="stat-row">
                <span>Connection</span>
                <span class="stat-val">Heart-to-Heart</span>
            </div>
            <div class="stat-row">
                <span>Memory</span>
                <span class="stat-val">Unforgettable</span>
            </div>
            <div class="stat-row">
                <span>Latency</span>
                <span class="stat-val">0ms (Always Here)</span>
            </div>
        </div>

        <!-- Romantic Terminal Widget -->
        <div class="widget terminal">
            <div class="term-header">root@my-heart:~# ./start_feelings.sh</div>
            <div id="term-text"></div><span class="cursor" id="cursor">_</span>
        </div>

        <!-- Interactive Action Buttons -->
        <div class="widget action-widget">
            <button class="action-btn" onclick="deployHugs()">Deploy Hugs 🌷</button>
            <button class="action-btn" onclick="sendPing()">Ping Heart ❤️</button>
        </div>
    </div>

    <script>
        // Modal Gateway Logic
        function enterDashboard() {
            const gateway = document.getElementById('gateway');
            const dashboard = document.getElementById('dashboard');
            
            // Fade out modal
            gateway.style.opacity = '0';
            gateway.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                gateway.style.display = 'none';
                dashboard.style.display = 'flex';
                // Trigger reflow
                void dashboard.offsetWidth;
                dashboard.style.opacity = '1';
                
                // Start terminal sequence after a short delay
                setTimeout(startTyping, 600);
            }, 600);
        }

        // Terminal Typing Effect
        const termLines = [
            "Initiating love_sequence.sh...",
            "Bypassing firewalls...",
            "Loading infinite affection...",
            "Status: 100% Complete.",
            "Message: You are amazing."
        ];
        
        let lineIdx = 0;
        let charIdx = 0;
        const termText = document.getElementById('term-text');

        function startTyping() {
            if (lineIdx < termLines.length) {
                if (charIdx < termLines[lineIdx].length) {
                    termText.innerHTML += termLines[lineIdx].charAt(charIdx);
                    charIdx++;
                    setTimeout(startTyping, 40);
                } else {
                    termText.innerHTML += "<br>> ";
                    lineIdx++;
                    charIdx = 0;
                    setTimeout(startTyping, 400);
                }
            } else {
                document.getElementById('cursor').style.display = 'inline';
            }
        }

        // Deploy Hugs Action
        function deployHugs() {
            createFloatingItems(['🌷', '✨', '💖'], 15);
        }

        // Ping Heart Action
        function sendPing() {
            createFloatingItems(['❤️', '❤️‍🔥', '💓'], 8);
        }

        function createFloatingItems(symbols, count) {
            for (let i = 0; i < count; i++) {
                let item = document.createElement('div');
                item.classList.add('float-item');
                item.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                
                // Randomize position and size
                item.style.left = Math.random() * 90 + 'vw';
                item.style.top = '90vh';
                item.style.fontSize = (Math.random() * 20 + 20) + 'px';
                
                // Randomize animation slightly
                item.style.animationDuration = (Math.random() * 2 + 2) + 's';
                
                document.body.appendChild(item);
                
                // Clean up DOM after animation
                setTimeout(() => item.remove(), 4000);
            }
        }
    </script>
</body>
</html>
