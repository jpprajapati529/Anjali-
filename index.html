<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>For My Favorite Person ❤️</title>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100dvh; 
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #4a4a4a;
      overflow: hidden;
      overscroll-behavior: none;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.88);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      padding: 2.5rem 1.5rem;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 88%;
      max-width: 350px;
      z-index: 10;
      transition: all 0.4s ease;
    }
    
    h1 { 
      color: #ff4b2b; 
      margin-top: 0;
      margin-bottom: 0.5rem; 
      font-size: 1.8rem; 
      letter-spacing: -0.5px;
    }
    
    p { 
      font-size: 1.05rem; 
      line-height: 1.5; 
      color: #555; 
      margin-bottom: 1.5rem;
    }
    
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: #ff4b2b;
      color: white;
      border: none;
      padding: 16px 24px; 
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      width: 100%;
    }
    
    .btn-no {
      background: #f0f0f0;
      color: #888;
    }

    .btn:active { 
      transform: scale(0.95); 
    }

    /* Screen 2: Hidden until Yes is clicked */
    #success-screen {
      display: none;
      animation: fadeIn 0.6s ease-out;
    }

    .cute-gif {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 1rem;
      pointer-events: none;
    }

    .timer-box {
      background: rgba(255, 75, 43, 0.1);
      padding: 15px;
      border-radius: 15px;
      margin-top: 1rem;
    }

    .timer-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4b2b;
      margin: 5px 0;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .heart {
      position: absolute;
      color: #ff4b2b;
      opacity: 0.6;
      animation: float 6s linear infinite;
      pointer-events: none;
    }
    
    @keyframes float {
      0% { transform: translate3d(0, 100dvh, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate3d(0, -10dvh, 0) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Screen 1: The Question -->
  <div class="card" id="question-screen">
    <h1>Hey Beautiful ✨</h1>
    <p>Will you be my forever valentine and my favorite person always?</p>
    
    <div class="btn-container">
      <button class="btn btn-yes" id="yes-btn" onclick="sayYes()">Yes! ❤️</button>
      <button class="btn btn-no" id="no-btn" onclick="sayNo()">No 😢</button>
    </div>
  </div>

  <!-- Screen 2: The Celebration & Timer -->
  <div class="card" id="success-screen">
    <!-- Cute Mochi Cat Hug GIF -->
    <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Cute Hug" class="cute-gif">
    <h1>I knew it! 🥰</h1>
    <p>I love you so much. We have been making memories for:</p>
    
    <div class="timer-box">
      <div class="timer-text" id="days">0 Days</div>
      <div class="timer-text" id="hours">0 Hours</div>
      <div class="timer-text" id="mins">0 Minutes</div>
      <div class="timer-text" id="secs">0 Seconds</div>
    </div>
  </div>

  <script>
    // --- CUSTOMIZE YOUR DATES AND TEXT HERE ---
    // Format: "YYYY-MM-DDTHH:MM:SS" (Example: "2023-10-14T18:30:00")
    const anniversaryDate = new Date("2023-01-01T00:00:00").getTime(); 
    
    const noButtonTexts = [
      "Are you sure? 🥺", 
      "Think again! 💔", 
      "Don't do this to me!", 
      "Pookie please! 😭", 
      "You're breaking my heart!", 
      "I'll buy you food! 🍕",
      "Okay, I'm not asking anymore. Say yes."
    ];
    // ------------------------------------------

    let noClickCount = 0;
    let yesButtonSize = 1;

    function sayNo() {
      const noBtn = document.getElementById('no-btn');
      const yesBtn = document.getElementById('yes-btn');

      // Change "No" button text
      noBtn.innerText = noButtonTexts[Math.min(noClickCount, noButtonTexts.length - 1)];
      noClickCount++;

      // Make "Yes" button bigger each time she taps "No"
      yesButtonSize += 0.4;
      yesBtn.style.transform = `scale(${yesButtonSize})`;
      
      // Add haptic feedback
      if (navigator.vibrate) navigator.vibrate(50);
    }

    function sayYes() {
      // Hide Question, Show Success
      document.getElementById('question-screen').style.display = 'none';
      document.getElementById('success-screen').style.display = 'block';
      
      // Start the love counter
      setInterval(updateTimer, 1000);
      updateTimer();

      // Trigger a massive heart explosion
      for(let i=0; i<30; i++) {
        setTimeout(createHeart, i * 100);
      }
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }

    function updateTimer() {
      const now = new Date().getTime();
      const difference = now - anniversaryDate;

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = days + " Days";
      document.getElementById('hours').innerText = hours + " Hours";
      document.getElementById('mins').innerText = minutes + " Minutes";
      document.getElementById('secs').innerText = seconds + " Seconds";
    }

    // Background floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 3 + 's';
      heart.style.fontSize = Math.random() * 20 + 12 + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    
    setInterval(createHeart, 450);
  </script>
</body>
</html>
