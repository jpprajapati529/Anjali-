<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <title>For My Favorite Person ❤️</title>
  <style>
    /* iOS-specific resets */
    * {
      -webkit-tap-highlight-color: transparent; /* Removes the ugly gray box when tapping buttons */
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      /* Uses Apple's native system font so it perfectly matches her iPhone */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      /* 100dvh is crucial for Safari to prevent the bottom URL bar from hiding content */
      min-height: 100dvh; 
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #4a4a4a;
      overflow: hidden;
      overscroll-behavior: none; /* Stops the webpage from "bouncing" when swiping up or down */
    }
    
    .card {
      background: rgba(255, 255, 255, 0.88);
      /* Requires the -webkit prefix to blur properly on older iOS versions */
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      padding: 2.5rem 1.5rem;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 88%;
      max-width: 350px;
      z-index: 10;
    }
    
    h1 { 
      color: #ff4b2b; 
      margin-top: 0;
      margin-bottom: 0.5rem; 
      font-size: 1.8rem; 
      letter-spacing: -0.5px;
    }
    
    p { 
      font-size: 1.05rem; 
      line-height: 1.5; 
      color: #555; 
    }
    
    .btn {
      background: #ff4b2b;
      color: white;
      border: none;
      /* Taller padding makes it easier to hit with a thumb on mobile */
      padding: 16px 24px; 
      font-size: 1.1rem;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      margin-top: 1rem;
      font-weight: 600;
      width: 100%; 
    }
    
    /* :active is better than :hover for touchscreens like the iPhone */
    .btn:active { 
      transform: scale(0.95); 
      background: #ff416c; 
    }
    
    .hidden-message { 
      display: none; 
      margin-top: 1.5rem; 
      color: #d63384; 
      font-weight: bold; 
      font-size: 1.1rem; 
      animation: fadeIn 0.4s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Hardware-accelerated animations (translate3d) keep the iPhone battery happy and animation smooth */
    .heart {
      position: absolute;
      color: #ff4b2b;
      opacity: 0.6;
      animation: float 6s linear infinite;
      pointer-events: none;
    }
    
    @keyframes float {
      0% { transform: translate3d(0, 100dvh, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate3d(0, -10dvh, 0) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hey Beautiful ✨</h1>
    <p>I built this little corner of the internet just for you.</p>
    <button class="btn" onclick="reveal()">Tap for a surprise 🎁</button>
    <div id="secret" class="hidden-message">
      You make every single day brighter! Ready for our next adventure? 💕
    </div>
  </div>

  <script>
    function reveal() {
      document.getElementById('secret').style.display = 'block';
      // Triggers a tiny haptic vibration on some iPhones if allowed
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
    }
    
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 3 + 's';
      heart.style.fontSize = Math.random() * 20 + 12 + 'px';
      document.body.appendChild(heart);
      
      setTimeout(() => heart.remove(), 6000);
    }
    
    // Increased from 300 to 450 to keep the animation buttery smooth on her phone
    setInterval(createHeart, 450); 
  </script>
</body>
</html>
