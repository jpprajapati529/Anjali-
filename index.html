<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 🌷</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            /* Soft blush fading into a deep crimson */
            background: linear-gradient(135deg, #ffccd5 0%, #dc143c 100%);
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.4);
            text-align: center;
            max-width: 600px;
            margin: 20px;
            z-index: 10;
        }

        h1 {
            /* Crimson text */
            color: #dc143c;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .center-icon {
            font-size: 60px;
            animation: gentle-bounce 2.5s infinite ease-in-out;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Floating background elements */
        .floating-tulips {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .float-item {
            position: absolute;
            opacity: 0.7;
            animation: floatUp 10s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0.9; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }
        
        .gallery {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .gallery img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 15px;
            /* Crimson image borders */
            border: 3px solid #dc143c;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.1) rotate(5deg);
        }
    </style>
</head>
<body>

    <div class="floating-tulips" id="floating-tulips"></div>

    <div class="container">
        <div class="center-icon">🌷</div>
        <h1>To My Favorite Person</h1>
        <p>
            I built this little corner of the internet just for us. 
            Like a crimson tulip, you bring so much beautiful color into my life!
        </p>
        
        <div class="gallery">
            <!-- Add links to your actual photos here -->
            <img src="https://via.placeholder.com/150/dc143c/ffffff?text=Photo+1" alt="Us">
            <img src="https://via.placeholder.com/150/dc143c/ffffff?text=Photo+2" alt="Us">
            <img src="https://via.placeholder.com/150/dc143c/ffffff?text=Photo+3" alt="Us">
        </div>
    </div>

    <script>
        // Generate floating tulips and sparkles
        const container = document.getElementById('floating-tulips');
        const floatSymbols = ['🌷', '🌷', '✨', '❤️']; 
        
        for (let i = 0; i < 25; i++) {
            let item = document.createElement('div');
            item.classList.add('float-item');
            item.innerText = floatSymbols[Math.floor(Math.random() * floatSymbols.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 5 + 7) + 's';
            item.style.animationDelay = (Math.random() * 5) + 's';
            item.style.fontSize = (Math.random() * 20 + 15) + 'px';
            container.appendChild(item);
        }
    </script>
</body>
</html>
